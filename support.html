<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>সাপোর্ট ফর্ম</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b1329; color: #f8fafc; margin: 0; padding: 14px; }
    .box { background: #162032; padding: 16px; border-radius: 12px; border: 1px solid #233554; }
    h3 { margin: 0 0 10px; color: #38bdf8; font-size: 16px; }
    label { display: block; margin: 12px 0 5px; font-size: 13px; color: #94a3b8; font-weight: 600; }
    .optional-tag { color: #64748b; font-weight: normal; font-size: 11px; }
    input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0b1329; color: #fff; font-size: 14px; }
    .btn-green { width: 100%; padding: 14px; background: #10b981; border: none; border-radius: 8px; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 18px; }
    .note { margin-top: 12px; font-size: 12px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>

  <div class="box">
    <h3>🛠️ সাপোর্ট ফর্ম জমা দিন</h3>
    <form id="supportForm">
      <label>আপনার নাম: <span style="color:#ef4444;">*</span></label>
      <input type="text" id="cust_name" required placeholder="আপনার নাম লিখুন">

      <label>মোবাইল নাম্বার: <span style="color:#ef4444;">*</span></label>
      <input type="tel" id="cust_phone" required placeholder="017xxxxxxxx">

      <label>ওয়েবসাইটের জিমেইল: <span class="optional-tag">(ঐচ্ছিক)</span></label>
      <input type="email" id="cust_email" placeholder="example@gmail.com">

      <label>সমস্যার বিস্তারিত বিবরণ: <span style="color:#ef4444;">*</span></label>
      <textarea id="cust_issue" rows="4" required placeholder="কী সমস্যা হচ্ছে বিস্তারিত লিখুন..."></textarea>

      <button type="submit" id="submitBtn" class="btn-green">পাঠিয়ে দিন</button>
      <div class="note">📷 স্ক্রিনশট থাকলে ফর্ম জমা দেওয়ার পর চ্যাটে পাঠাতে পারবেন।</div>
    </form>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    document.getElementById('supportForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('cust_name').value.trim();
      const phone = document.getElementById('cust_phone').value.trim();
      const email = document.getElementById('cust_email').value.trim() || 'দেওয়া হয়নি';
      const issue = document.getElementById('cust_issue').value.trim();

      // ছোট ও নিখুঁত ডেটা পাঠানো হচ্ছে যেন টেলিগ্রাম আটকে না দেয়
      tg.sendData(JSON.stringify({ name, phone, email, issue }));
      tg.close();
    });
  </script>
</body>
</html>
