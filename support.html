<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>সাপোর্ট ফর্ম</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b1329; color: #f8fafc; margin: 0; padding: 14px; }
    .box { background: #162032; padding: 16px; border-radius: 12px; border: 1px solid #233554; }
    h3 { margin: 0 0 10px; color: #38bdf8; font-size: 16px; }
    label { display: block; margin: 12px 0 5px; font-size: 13px; color: #94a3b8; font-weight: 600; }
    .optional-tag { color: #64748b; font-weight: normal; font-size: 11px; }
    input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0b1329; color: #fff; font-size: 14px; }
    .btn-green { width: 100%; padding: 14px; background: #10b981; border: none; border-radius: 8px; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 18px; }
    .btn-green:disabled { background: #475569; }
    .note { margin-top: 12px; font-size: 12px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>

  <div class="box">
    <h3>🛠️ সাপোর্ট ফর্ম জমা দিন</h3>
    <form id="supportForm">
      <label>আপনার নাম: <span style="color:#ef4444;">*</span></label>
      <input type="text" id="cust_name" required placeholder="আপনার নাম লিখুন">

      <label>মোবাইল নাম্বার: <span style="color:#ef4444;">*</span></label>
      <input type="tel" id="cust_phone" required placeholder="017xxxxxxxx">

      <label>ওয়েবসাইটের জিমেইল: <span class="optional-tag">(ঐচ্ছিক)</span></label>
      <input type="email" id="cust_email" placeholder="example@gmail.com">

      <label>সমস্যার বিস্তারিত বিবরণ: <span style="color:#ef4444;">*</span></label>
      <textarea id="cust_issue" rows="4" required placeholder="কী সমস্যা হচ্ছে বিস্তারিত লিখুন..."></textarea>

      <button type="submit" id="submitBtn" class="btn-green">পাঠিয়ে দিন</button>
      <div class="note">📷 স্ক্রিনশট থাকলে ফর্ম জমা দেওয়ার পর চ্যাটে পাঠাতে পারবেন।</div>
    </form>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const BOT_TOKEN = "8859855010:AAEh0Rrdb8665y0v91ACP8N437B90Iu2dzk";
    const ADMIN_CHAT_ID = "8694336266";

    document.getElementById('supportForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "পাঠানো হচ্ছে...";

      const name = document.getElementById('cust_name').value.trim();
      const phone = document.getElementById('cust_phone').value.trim();
      const email = document.getElementById('cust_email').value.trim() || 'দেওয়া হয়নি';
      const issue = document.getElementById('cust_issue').value.trim();

      const user = tg.initDataUnsafe?.user;
      const userId = user?.id;

      const adminText = `🚨 নতুন কাস্টমার সাপোর্ট চ্যাট!\n\n` +
                        `👤 নাম: ${name}\n` +
                        `📱 মোবাইল: ${phone}\n` +
                        `📧 জিমেইল: ${email}\n` +
                        `🆔 ইউজার আইডি: ${userId || 'N/A'}\n\n` +
                        `📝 সমস্যা:\n${issue}`;

      const adminMarkup = {
        inline_keyboard: [
          [
            { text: "⏳ ৫ মিনিট বাড়ান", callback_data: `ext_${userId}` },
            { text: "🔒 চ্যাট বন্ধ", callback_data: `close_${userId}` }
          ],
          [
            { text: "👑 ওনারে ট্রান্সফার", callback_data: `trans_${userId}` }
          ]
        ]
      };

      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: ADMIN_CHAT_ID,
            text: adminText,
            reply_markup: adminMarkup
          })
        });

        if (userId) {
          const custMarkup = {
            inline_keyboard: [
              [{ text: "🛑 চ্যাট বন্ধ করুন", callback_data: `custclose_${userId}` }]
            ]
          };

          const custText = `✅ আপনার সমস্যার বিবরণ আমাদের কাছে পৌঁছেছে!\n\n` +
                           `⏳ আমাদের প্রতিনিধি সর্বোচ্চ ১০ মিনিটের মধ্যে আপনার সমস্যার সমাধান করার চেষ্টা করবে।\n` +
                           `⏱️ বাকি সময়: ১০:০০ মিনিট\n\n` +
                           `📷 কোনো স্ক্রিনশট থাকলে এখনই চ্যাটে পাঠিয়ে দিতে পারেন।`;

          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: userId,
              text: custText,
              reply_markup: custMarkup
            })
          });
        }

        tg.close();
      } catch (err) {
        alert("মেসেজ পাঠাতে সমস্যা হয়েছে!");
        btn.disabled = false;
        btn.innerText = "পাঠিয়ে দিন";
      }
    });
  </script>
</body>
</html>
